<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b1d">
  <title>Um presente para você</title>
  <style>
    :root { color-scheme: dark; --pink:#ff4fa3; --purple:#9b5cff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; font-family: Arial, Helvetica, sans-serif; color: #fff;
      background: radial-gradient(circle at 50% 25%, #3b1b57 0, #171024 42%, #09070f 100%);
    }
    .card {
      width: min(100%, 430px); text-align: center; padding: 34px 24px 30px;
      border: 1px solid rgba(255,255,255,.14); border-radius: 28px;
      background: rgba(255,255,255,.06); box-shadow: 0 24px 80px #0008;
      backdrop-filter: blur(10px);
    }
    .eyebrow { margin: 0 0 10px; color: #e7cfff; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; }
    h1 { margin: 0 0 10px; font-size: clamp(27px, 7vw, 36px); line-height: 1.08; }
    .sub { margin: 0 auto 20px; max-width: 300px; color: #d5cddd; line-height: 1.5; }
    .gift-wrap { display: inline-grid; place-items: center; width: 190px; height: 190px; margin: 4px 0 22px; cursor: pointer; border: 0; background: transparent; }
    .gift { font-size: 118px; line-height: 1; filter: drop-shadow(0 12px 24px #ff4fa355); animation: float 2.4s ease-in-out infinite; transition: transform .2s; }
    .gift-wrap:hover .gift { transform: scale(1.08) rotate(-4deg); }
    .button {
      display: block; width: 100%; padding: 16px 20px; border-radius: 999px;
      color: #fff; text-decoration: none; font-size: 16px; font-weight: 800;
      background: linear-gradient(100deg, var(--pink), var(--purple));
      box-shadow: 0 10px 28px #a34dff44; transition: transform .2s, filter .2s;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .hint { color: #a99eb8; font-size: 12px; margin: 15px 0 0; }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-9px) rotate(2deg); } }
    @media (prefers-reduced-motion: reduce) { .gift { animation: none; } * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <a class="gift-wrap" href="https://www.crownbot.com.br/natyvampirinha" aria-label="Abrir o presente">
      <span class="gift" aria-hidden="true">🎁</span>
    </a>
    <a class="button" href="https://www.crownbot.com.br/natyvampirinha">CLIQUE AQUI PARA ABRIR</a>
  </main>
</body>
</html>
